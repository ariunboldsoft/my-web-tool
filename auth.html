<!DOCTYPE html>
<html lang="mn">
<head>
  <script>
    if (localStorage.getItem('isAuthenticated') !== 'true' || !localStorage.getItem('currentUserPhone')) {
      window.location.href = 'auth.html';
    }
    const currentPhone = localStorage.getItem('currentUserPhone');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ӨСӨХҮЙ | Хүүхдийн Хөгжлийн Хянагч</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    
  <div class="app">
    <div class="user-header">
      <div>
        <h3>Утас: <span id="display-phone"></span></h3>
      </div>
      <button class="logout-btn" onclick="logout()">Гарах</button>
    </div>

    <!-- Main Dashboard container populated by app.js -->
    <div class="dashboard">
      <h2>Хүүхдийн профайл ба бүртгэл</h2>
      
      <div class="form-group">
        <label for="childName">Хүүхдийн нэр:</label>
        <input type="text" id="childName" placeholder="Жишээ: Тэмүүлэн">
      </div>

      <div class="form-group">
        <label for="childAge">Нас / Төрсөн огноо:</label>
        <input type="text" id="childAge" placeholder="Жишээ: 5 настай">
      </div>

      <div class="form-group">
        <label for="childNotes">Хөгжлийн тэмдэглэл:</label>
        <textarea id="childNotes" rows="5" placeholder="Энд хүүхдийнхээ хөгжил, явцын талаар бичнэ үү..."></textarea>
      </div>

      <button onclick="saveUserData(false)">Хадгалах</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
