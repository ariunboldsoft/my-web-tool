<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>Өсөхүй | Хүүхдийн Хөгжлийн Хянагч</title>
  <style>
    @keyframes cardEntrance {
      0% { opacity: 0; transform: translateY(20px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
      color: #2d3748;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-card {
      background: #ffffff;
      padding: 40px 35px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    h2 {
      color: #2b6cb0;
      margin: 0 0 5px 0;
      font-size: 26px;
    }

    p {
      color: #718096;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      box-sizing: border-box;
      font-size: 16px;
      text-align: center;
      letter-spacing: 2px;
      background: #f8fafc;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #4299e1;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(66, 153, 225, 0.15);
    }

    button {
      background: #48bb78;
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(72, 187, 120, 0.3);
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    button:hover {
      background: #38a169;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
    }

    .error {
      color: #e53e3e;
      font-size: 13px;
      margin-top: 15px;
      display: none;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="logo-icon">🌱</div>
    <h2>ӨСӨХҮЙ</h2>
    <p>Хүүхдийн хөгжлийн хянагч систем</p>
    
    <div class="input-group">
      <label for="phone">Утасны дугаар (8 оронтой)</label>
      <input type="text" id="phone" maxlength="8" placeholder="99112233">
    </div>

    <div class="input-group">
      <label for="code">Баталгаажуулах код (4 оронтой)</label>
      <input type="text" id="code" maxlength="4" placeholder="••••">
    </div>

    <button onclick="verifyAuth()">Нэвтрэх</button>
    <div id="error-msg" class="error">Утасны дугаар эсвэл код буруу байна.</div>
  </div>

  <script>
    // Built-in Web Audio API sound effects (no external files needed!)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'click') {
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'success') {
        // Joyful success chime sequence
        const now = audioCtx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
          let o = audioCtx.createOscillator();
          let g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.frequency.setValueAtTime(freq, now + index * 0.08);
          g.gain.setValueAtTime(0.08, now + index * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.3);
          o.start(now + index * 0.08);
          o.stop(now + index * 0.08 + 0.3);
        });
      }
    }

    // Attach click/typing sounds
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', () => playSound('click'));
    });

    function generateCodeFromPhone(phone) {
      if (phone.length !== 8) return null;
      let part1 = parseInt(phone.substring(0, 4));
      let part2 = parseInt(phone.substring(4, 8));
      let generated = (part1 + part2) % 9000 + 1000; 
      return generated.toString();
    }

    function verifyAuth() {
      playSound('click');
      const phone = document.getElementById('phone').value.trim();
      const enteredCode = document.getElementById('code').value.trim();
      const errorMsg = document.getElementById('error-msg');

      if (phone.length !== 8) {
        errorMsg.style.display = 'block';
        return;
      }

      const expectedCode = generateCodeFromPhone(phone);

      if (enteredCode === expectedCode) {
        errorMsg.style.display = 'none';
        playSound('success'); // Play the chime
        localStorage.setItem('isAuthenticated', 'true');
        localStorage.setItem('currentUserPhone', phone);
        
        // Brief delay so the user hears the chime before redirection
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      } else {
        errorMsg.style.display = 'block';
      }
    }
  </script>

</body>
</html>
